server:
  port: 8082
spring:
  application:
    name: "PruebaFranquicia"
  devtools:
    add-properties: false
  profiles:
    active: "local"

  r2dbc:
    postgresql:
      host: ${DB_HOST:gondola.proxy.rlwy.net}
      port: ${DB_PORT:39683}
      database: ${DB_NAME:railway}
      schema: ${DB_SCHEMA:public}
      username: ${DB_USER:postgres}
      password: ${DB_PASSWORD:KlCadXcunKSraYhTlNuzXcWNBOkhscWD}

  connection-pool:
    initial-size: ${CONN_POOL_INITIAL_SIZE:12}
    max-size: ${CONN_POOL_MAX_SIZE:15}
    max-idle-time: ${CONN_POOL_IDLE_TIME:30}

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
